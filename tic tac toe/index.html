<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        
        
        <div class="container">
                <h1 class="Win hide">Winner</h1>
                <button class="new-game hide">New Game</button>
            <h1>Tic Tac Toe</h1>
            <div class="game">
                <button class="box box0"></button>
                <button class="box box1"></button>
                <button class="box box2"></button><br>
                <button class="box box3"></button>
                <button class="box box4"></button>
                <button class="box box5"></button><br>
                <button class="box box6"></button>
                <button class="box box7"></button>
                <button class="box box8"></button>
            </div>
            <button class="reset-btn">Reset</button>
        </div>
        
    </main>
    <script src="app.js"></script>
</body>
</html>
